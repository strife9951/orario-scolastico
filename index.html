<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Il mio orario — Scuola</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@simplewebauthn/browser@13.1.0/dist/bundle/index.umd.min.js"></script>
  <style>
    :root { --bg:#0b1220; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.1); --text:#f4f7ff; --muted:#9aa8c2; --accent:#5eead4; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Outfit,system-ui,sans-serif; background:radial-gradient(1200px 600px at 10% -10%,#1d4ed833,transparent 50%),radial-gradient(900px 500px at 100% 0%,#0f766e33,transparent 45%),var(--bg); color:var(--text); min-height:100vh; }
    .app { max-width:980px; margin:0 auto; padding:20px 18px 48px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .logo { width:46px; height:46px; border-radius:14px; background:linear-gradient(135deg,#5eead4,#60a5fa); display:grid; place-items:center; font-weight:800; color:#042f2e; }
    .brand h1 { font-size:1.25rem; }
    .brand p { color:var(--muted); font-size:.85rem; }
    .card { background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03)); border:1px solid var(--line); border-radius:20px; padding:18px; margin-bottom:16px; }
    .kicker { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; }
    .title { font-size:1.35rem; margin:6px 0 12px; }
    .sub { color:var(--muted); font-size:.86rem; }
    input,button { font:inherit; }
    input { width:100%; background:#0b1220; color:var(--text); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:4px; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0; }
    .btn { border:0; border-radius:12px; padding:10px 14px; cursor:pointer; font-weight:600; background:linear-gradient(135deg,#2dd4bf,#38bdf8); color:#042f2e; }
    .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
    .hidden { display:none !important; }
    .student-chip { display:inline-block; padding:6px 12px; margin:4px; border-radius:999px; border:1px solid var(--line); cursor:pointer; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">OS</div>
      <div>
        <h1>Il mio orario</h1>
        <p id="headerStatus">Accesso con Passkey</p>
      </div>
    </div>
  </header>

  <section class="card" id="authCard">
    <div class="kicker">Passkey (Vercel)</div>
    <h2 class="title">Accedi o registra passkey</h2>
    <p class="sub">Autenticazione passkey gestita interamente su Vercel + Blob.</p>
    <label>Email <input id="email" type="email" placeholder="studente@email.it" /></label>
    <div class="toolbar">
      <button class="btn" id="btnReg">Registra Passkey</button>
      <button class="btn ghost" id="btnLogin">Accedi con Passkey</button>
      <button class="btn ghost" id="btnOut" style="display:none">Esci</button>
    </div>
    <p id="authNote" class="sub"></p>
  </section>

  <section class="card hidden" id="appCard">
    <div class="kicker">Studenti</div>
    <h2 class="title">I tuoi studenti</h2>
    <div id="studentList"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
      <label>Nome <input id="newNome" placeholder="Giulia Rossi" /></label>
      <label>Classe <input id="newClasse" placeholder="3A" /></label>
    </div>
    <div class="toolbar">
      <button class="btn" id="addStudent">Aggiungi studente</button>
      <button class="btn ghost" id="saveData">Salva su Blob</button>
    </div>
    <p id="appNote" class="sub"></p>
  </section>
</div>

<script>
const { startRegistration, startAuthentication } = SimpleWebAuthnBrowser;
let currentEmail = localStorage.getItem('orario.email') || null;
let data = { studenti: [] };

function note(id, msg) { document.getElementById(id).textContent = msg || ''; }

async function postJson(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const text = await r.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch { throw new Error('Risposta non valida dal server.'); }
  if (!r.ok) {
    const err = data.error;
    const msg = typeof err === 'string' ? err : (err && err.message) || data.message || ('Errore ' + r.status);
    throw new Error(msg);
  }
  return data;
}

function setLogged(email) {
  currentEmail = email;
  localStorage.setItem('orario.email', email || '');
  document.getElementById('authCard').classList.toggle('hidden', !!email);
  document.getElementById('appCard').classList.toggle('hidden', !email);
  document.getElementById('btnOut').style.display = email ? '' : 'none';
  document.getElementById('headerStatus').textContent = email ? email + ' · a.s. 2026/27' : 'Accesso con Passkey';
  if (email) loadData();
}

async function loadData() {
  if (!currentEmail) return;
  const r = await fetch('/api/data', { headers: { Authorization: currentEmail } });
  data = r.ok ? await r.json() : { studenti: [] };
  renderStudents();
}

async function saveData() {
  if (!currentEmail) return;
  await fetch('/api/data', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: currentEmail },
    body: JSON.stringify(data)
  });
  note('appNote', 'Salvato su Vercel Blob.');
}

function renderStudents() {
  const box = document.getElementById('studentList');
  box.innerHTML = (data.studenti || []).map(s =>
    `<span class="student-chip">${s.nome} · ${s.classe}</span>`
  ).join('') || '<span class="sub">Nessuno studente.</span>';
}

document.getElementById('btnReg').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  if (!email) return alert('Inserisci email.');
  try {
    const opts = await postJson('/api/passkey/register', { email });
    if (!opts.challenge) throw new Error('Il server non ha restituito la challenge.');
    const cred = await startRegistration({ optionsJSON: opts });
    const res = await postJson('/api/passkey/register', { email, credential: cred });
    if (!res.verified) throw new Error('Registrazione fallita');
    note('authNote', 'Passkey registrata.');
    setLogged(email);
  } catch (e) { alert(e.message); }
};

document.getElementById('btnLogin').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  if (!email) return alert('Inserisci email.');
  try {
    const opts = await postJson('/api/passkey/login', { email });
    if (!opts.challenge) throw new Error('Il server non ha restituito la challenge.');
    const cred = await startAuthentication({ optionsJSON: opts });
    const res = await postJson('/api/passkey/login', { email, credential: cred });
    if (!res.verified) throw new Error('Login fallito');
    note('authNote', 'Accesso con passkey ok.');
    setLogged(email);
  } catch (e) { alert(e.message); }
};

document.getElementById('btnOut').onclick = () => setLogged(null);

document.getElementById('addStudent').onclick = async () => {
  const nome = document.getElementById('newNome').value.trim();
  const classe = document.getElementById('newClasse').value.trim();
  if (!nome || !classe) return alert('Nome e classe obbligatori.');
  data.studenti = data.studenti || [];
  data.studenti.push({ nome, classe });
  document.getElementById('newNome').value = '';
  document.getElementById('newClasse').value = '';
  renderStudents();
  await saveData();
};

document.getElementById('saveData').onclick = saveData;

if (currentEmail) setLogged(currentEmail);
</script>
</body>
</html>
